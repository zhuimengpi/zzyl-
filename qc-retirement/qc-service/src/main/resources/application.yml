spring:
  # 配置文件
  profiles:
    active: dev
  # 连接MySQL数据库
  datasource:
    driver-class-name: ${zzyl.mysql.driver-class-name}
    url: ${zzyl.mysql.url}
    username: ${zzyl.mysql.username}
    password: ${zzyl.mysql.password}
  # 连接Redis数据库
  data:
    redis:
      host: ${redis.host}
      port: ${redis.port}
      password: ${redis.password}
      database: ${redis.database}
      # 连接池配置
      lettuce:
        pool:
          max-active: 8 #最大连接数
          max-idle: 8 #最大空闲连接数
          min-idle: 0 #最小空闲连接数
          max-wait: 1000 #最大等待时间
  # 阿里云dashscope AI接入
  aliyun:
    accessKeyId: ${aliyun.accessKeyId}

# 端口配置
server:
  # 前端代理端口
  port: 9997

# Mybatis配置
mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

# 微信小程序配置
wechat:
  app-id: ${Wechat.app-id}
  secret: ${Wechat.secret}

# JWT配置
jwt:
  #员工系统端
  #加密密钥
  employee-key: zhui
  #刷新时间（1h）
  employee-refresh-ttl: 3600000
  #前端传递令牌名称
  employee-token-name: Authorization

# 阿里云OSS
aliyun:
  oss:
    endpoint: ${aliyun.oss.endpoint}      #域名地址
    bucketName: ${aliyun.oss.bucketName}     #OSS中bucket名称
    region: ${aliyun.oss.region}     #bucket所在地域
    access-key-id: ${aliyun.oss.access-key-id} #阿里云账号
    access-key-secret: ${aliyun.oss.access-key-secret} #阿里云密钥